name: Release Android (CH Play)

on:
  push:
    tags:
      - 'v*' # Trigger khi push git tag dạng v1.0.0, v1.0.1...
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build AAB & Submit Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android App Bundle (AAB) on EAS
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Google Play Store (Internal Track)
        if: env.SUBMIT_ENABLED == 'true'
        env:
          SUBMIT_ENABLED: ${{ secrets.SUBMIT_TO_PLAY_STORE }}
        run: eas submit --platform android --profile production --non-interactive
