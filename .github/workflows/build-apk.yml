name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi push tag dạng v1.0.0, v1.0.1...
  workflow_dispatch: # Hoặc kích hoạt thủ công từ giao diện Actions trên GitHub
    inputs:
      version:
        description: 'Tên tag phiên bản (ví dụ v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Android Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon
          cd ..

      - name: Decode Keystore from Secret
        run: |
          mkdir -p credentials
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > credentials/release.keystore

      - name: Sign APK with persistent Keystore
        run: |
          TAG_NAME="${{ github.event.inputs.version || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="${{ github.event.inputs.version || 'v1.0.0' }}"
          fi
          # Ensure tag has v prefix
          if [[ ! "$TAG_NAME" == v* ]]; then
            TAG_NAME="v${TAG_NAME}"
          fi

          APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Tìm thấy file APK gốc: $APK_RAW"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | sort -V | tail -n 1)

          FINAL_APK="ExpenseTracker-${TAG_NAME}.apk"

          echo "Đang ký chứng chỉ APK bằng $APKSIGNER..."
          $APKSIGNER sign --ks credentials/release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out "$FINAL_APK" \
            "$APK_RAW"

          $APKSIGNER verify "$FINAL_APK"
          echo "✅ Ký APK thành công: $FINAL_APK"
          echo "APK_FILE=$FINAL_APK" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Cleanup keystore
        if: always()
        run: rm -f credentials/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Expense Tracker ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


